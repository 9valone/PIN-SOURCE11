name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path PIN_SOURCE_NO_LOGIN_SAFE.zip -DestinationPath source

      - name: Find project files
        shell: pwsh
        run: |
          Get-ChildItem source -Recurse -Filter *.csproj
